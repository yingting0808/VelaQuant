services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_stocks
      POSTGRES_PASSWORD: ai_stocks
      POSTGRES_DB: ai_stocks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /workspace/apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      AI_STOCKS_DATABASE_URL: postgresql+psycopg://ai_stocks:ai_stocks@postgres:5432/ai_stocks
      AI_STOCKS_CORS_ORIGIN: http://localhost:3000
      AI_STOCKS_DATA_MODE: ${AI_STOCKS_DATA_MODE:-hybrid}
      AI_STOCKS_LEAN_BACKTEST_TIMEOUT_SECONDS: ${AI_STOCKS_LEAN_BACKTEST_TIMEOUT_SECONDS:-600}
      AI_STOCKS_PAPER_SCHEDULER_ENABLED: "true"
      AI_STOCKS_PAPER_SCHEDULER_CRON: "30 6 * * *"
      AI_STOCKS_PAPER_SCHEDULER_TIMEZONE: Asia/Shanghai
      AI_STOCKS_TRADING_DAY_MODE: market_calendar
      AI_STOCKS_EVENT_BUS_MODE: redis
      AI_STOCKS_REDIS_URL: redis://redis:6379/0
      AI_STOCKS_REDIS_STREAM_NAME: trading:events
      AI_STOCKS_OPENAI_RESEARCH_ENABLED: ${AI_STOCKS_OPENAI_RESEARCH_ENABLED:-true}
      AI_STOCKS_OPENAI_API_KEY: ${AI_STOCKS_OPENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_STOCKS_OPENAI_BASE_URL: ${AI_STOCKS_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_STOCKS_OPENAI_RESEARCH_MODEL: ${AI_STOCKS_OPENAI_RESEARCH_MODEL:-gpt-5.5}
      AI_STOCKS_OPENAI_TIMEOUT_SECONDS: ${AI_STOCKS_OPENAI_TIMEOUT_SECONDS:-20}
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    working_dir: /workspace/apps/web
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
    depends_on:
      - api

volumes:
  postgres_data:
